name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          git clone https://github.com/yonaskolb/XcodeGen.git xcodegen-src
          cd xcodegen-src
          swift build -c release
          cp .build/release/xcodegen /usr/local/bin/

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild -project TapApp.xcodeproj -scheme TapApp -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" GENERATE_INFOPLIST_FILE=YES build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TapApp.app Payload/
          zip -r TapApp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TapApp-ipa
          path: TapApp.ipa
