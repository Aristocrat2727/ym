name: TapApp
options:
  bundleIdPrefix: com.tapapp
deploymentTarget:
  iOS: "15.0"
targets:
  TapApp:
    type: application
    platform: iOS
    sources:
      - Sources
        settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
